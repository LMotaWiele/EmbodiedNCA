[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embodiednca"
version = "0.1.0"
description = "Resource-gated embodied Neural Cellular Automata (closed v0–v5 series)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/embodiednca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
